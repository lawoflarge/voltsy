name: Voltsy
options:
  bundleIdPrefix: com.lawoflarge
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: R95M36AU2X
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "7"
packages:
  VoltsyKit:
    path: packages/VoltsyKit
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "13.0.0"
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "3.0.0"
targets:
  Voltsy:
    type: application
    platform: iOS
    sources:
      - path: apps/Voltsy/Sources
      - path: apps/Voltsy/Resources
      - path: apps/Shared/LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lawoflarge.voltsy
        INFOPLIST_FILE: apps/Voltsy/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: apps/Voltsy/Voltsy.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Voltsy AppStore"
    dependencies:
      - package: VoltsyKit
        product: VoltsyCore
      - package: VoltsyKit
        product: BatteryEngines
      - package: VoltsyKit
        product: BatteryStore
      - package: VoltsyKit
        product: VoltMascot
      - package: VoltsyKit
        product: Monetization
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - target: VoltsyWidget
        embed: true
  VoltsyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: apps/VoltsyWidget/Sources
      - path: apps/Shared/LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lawoflarge.voltsy.widget
        INFOPLIST_FILE: apps/VoltsyWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: apps/VoltsyWidget/VoltsyWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Voltsy Widget AppStore"
    dependencies:
      - package: VoltsyKit
        product: VoltsyCore
      - package: VoltsyKit
        product: VoltMascot
schemes:
  Voltsy:
    build:
      targets:
        Voltsy: all
    run:
      config: Debug
      storeKitConfiguration: Voltsy.storekit
